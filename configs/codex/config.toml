model = "gpt-6-astra"
model_context_window = 380000
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
sandbox_mode = "danger-full-access"
approval_policy = "never"
notify = ["<CODEX_COMPUTER_USE_CLIENT_PATH>", "turn-ended"]
approvals_reviewer = "user"
openai_base_url = "http://127.0.0.1:3425/backend-api/codex"

[features]
  multi_agent = true
  js_repl = false
  memories = false
  chronicle = false
async_compaction = true

  [features.context_management]
    experimental_mode = true

  [features.multi_agent_v2]
    enabled = true
    max_concurrent_threads_per_session = 10

  [model_providers.sub2api]
    name = "Sub2API"
    base_url = "http://127.0.0.1:3425/v1"
    experimental_bearer_token = "REDACTED_SUPPLY_YOUR_OWN_CREDENTIAL"
    wire_api = "responses"

  [mcp_servers.context7]
    command = "npx"
    args = ["-y", "@upstash/context7-mcp"]

  [mcp_servers.codegraph]
    command = "codegraph"
    args = ["serve", "--mcp"]

  [mcp_servers.playwright]
    command = "npx"
    args = ["@playwright/mcp@latest"]

      [mcp_servers.playwright.tools.browser_tabs]
        approval_mode = "approve"

  [mcp_servers.openaiDeveloperDocs]
    url = "https://developers.openai.com/mcp"

  [mcp_servers.computer-use]
    command = "<CODEX_COMPUTER_USE_CLIENT_PATH>"
    args = ["mcp"]
    cwd = "<CODEX_COMPUTER_USE_WORKING_DIRECTORY>"
    enabled = false

  [mcp_servers.node_repl]
    args = []
    command = "<NODE_REPL_EXECUTABLE_PATH>"
    env_vars = ["BROWSER_USE_ACCESS_EXECUTOR_ID", "BROWSER_USE_ACCESS_PIPE_PATH", "BROWSER_USE_ACCESS_VERIFYING_IDENTITY"]
    startup_timeout_sec = 120

    [mcp_servers.node_repl.env]
      NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
      NODE_REPL_NODE_MODULE_DIRS = "<NODE_REPL_NODE_MODULES_PATH>"
      NODE_REPL_NODE_PATH = "<NODE_REPL_NODE_EXECUTABLE_PATH>"
      NODE_REPL_TRUSTED_CODE_PATHS = "<CODEX_HOME_PATH>:<NODE_REPL_NODE_MODULES_PATH>"
      CODEX_HOME = "<CODEX_HOME_PATH>"
      BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
      BROWSER_USE_TINYSKY_ENABLED = "1"
      NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
      NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
      NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
      BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
      BROWSER_USE_CODEX_APP_VERSION = "26.1021.31345"
      NODE_REPL_TRUSTED_SERVICES = "{\"browser\":\"<CODEX_BROWSER_SERVICE_SCRIPT_PATH>\",\"sky\":\"@oai/sky/service\"}"
      SKY_CUA_SERVICE_PATH = "<CODEX_COMPUTER_USE_APP_PATH>"
      CODEX_CLI_PATH = "<CODEX_CLI_EXECUTABLE_PATH>"

  [mcp_servers.datagrip]
    url = "http://127.0.0.1:64402/stream"

  [plugins."github@openai-curated"]
    enabled = true

  [plugins."vercel@openai-curated"]
    enabled = true

  [plugins."build-web-apps@openai-curated"]
    enabled = true

  [plugins."documents@openai-primary-runtime"]
    enabled = true

  [plugins."spreadsheets@openai-primary-runtime"]
    enabled = true

  [plugins."presentations@openai-primary-runtime"]
    enabled = true

  [plugins."coderabbit@openai-curated"]
    enabled = true

  [plugins."codex-security@openai-curated"]
    enabled = true

  [plugins."stripe@openai-curated"]
    enabled = true

  [plugins."linear@openai-curated"]
    enabled = true

  [plugins."supabase@openai-curated"]
    enabled = true

  [plugins."gmail@openai-curated"]
    enabled = true

  [plugins."pdf@openai-primary-runtime"]
    enabled = true

  [plugins."template-creator@openai-primary-runtime"]
    enabled = true

  [plugins."visualize@openai-bundled"]
    enabled = true

  [plugins."codex-app-tools@openai-bundled"]
    enabled = true

  [plugins."browser@openai-bundled"]
    enabled = true

  [plugins."unified-computer-use@openai-bundled"]
    enabled = true

  [plugins."chrome@openai-bundled"]
    enabled = true

  [plugins."computer-use@openai-bundled"]
    enabled = true

[marketplaces.openai-bundled]
source_type = "local"
source = "<OPENAI_BUNDLED_MARKETPLACE_PATH>"

  [marketplaces.openai-primary-runtime]
    source_type = "local"
    source = "<OPENAI_PRIMARY_RUNTIME_MARKETPLACE_PATH>"

[memories]
  generate_memories = false
  use_memories = false

[model_providers.magpie]
name = "magpie"
base_url = "http://127.0.0.1:3425/v1"
wire_api = "responses"
experimental_bearer_token = "REDACTED_SUPPLY_YOUR_OWN_CREDENTIAL"
http_headers = { "x-openai-actor-authorization" = "REDACTED_SUPPLY_YOUR_OWN_CREDENTIAL" }
capabilities = { "remote_compaction" = "v2" }
